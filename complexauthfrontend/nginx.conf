server {
    # Listen for HTTP traffic on port 80
    listen 80;

    # Hostname this server responds to
    server_name localhost;

    # Location of the built React application
    root /usr/share/nginx/html;
    index index.html;

    # Send API requests to the FastAPI backend
    location /api/ {
        # "backend" is the Docker Compose service name
        proxy_pass http://backend:8000/;

        # Pass information about the original request to FastAPI
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve the React application
    location / {
        # If the requested file doesn't exist, serve index.html
        # so React Router can handle the URL.
        try_files $uri $uri/ /index.html;
    }
}